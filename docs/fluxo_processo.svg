serviço às equipes</text><text x="850" y="547.525" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">(capacidade)</text><rect x="615" y="490" width="150" height="80" rx="10" fill="#fdeef3" stroke="#b0124a" stroke-width="1.6"/><text x="690" y="527.275" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">Publicar no MVP</text><text x="690" y="540.775" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">(SQLite + JSON/API)</text><polygon points="530,505.0 555.0,530 530,555.0 505.0,530" fill="#fff8e1" stroke="#b07d00" stroke-width="1.6"/><text x="530" y="536.3" font-size="18" text-anchor="middle" fill="#b07d00" font-weight="700">✕</text><text x="530" y="479.35" font-size="11" text-anchor="middle" fill="#5c4400" font-weight="600">Há ordens de serviço</text><text x="530" y="492.35" font-size="11" text-anchor="middle" fill="#5c4400" font-weight="600">ou áreas em risco?</text><rect x="455" y="630" width="150" height="80" rx="10" fill="#fdeef3" stroke="#b0124a" stroke-width="1.6"/><text x="530" y="655.525" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">Alertar equipes (OS)</text><text x="530" y="669.025" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">e moradores das áreas</text><text x="530" y="682.525" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">(idempotente, LGPD)</text><text x="530" y="705.55" font-size="13" text-anchor="middle" fill="#b0124a" font-weight="700">≡</text><rect x="295" y="490" width="150" height="80" rx="10" fill="#fdeef3" stroke="#b0124a" stroke-width="1.6"/><text x="370" y="527.275" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">Notificar operação e</text><text x="370" y="540.775" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">registrar auditoria</text><circle cx="230" cy="530" r="18.0" fill="#fff" stroke="#1f2328" stroke-width="4"/><text x="230" y="573.