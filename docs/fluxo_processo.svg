e" fill="#5c4400" font-weight="600">Cache com</text><text x="690" y="50.35" font-size="11" text-anchor="middle" fill="#5c4400" font-weight="600">menos de 24h?</text><rect x="775" y="50" width="150" height="80" rx="10" fill="#fdeef3" stroke="#b0124a" stroke-width="1.6"/><text x="850" y="80.525" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">Notificar operação:</text><text x="850" y="94.025" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">falha (verificação</text><text x="850" y="107.525" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">manual)</text><circle cx="990" cy="90" r="18.0" fill="#fff" stroke="#cf222e" stroke-width="4"/><text x="990" y="95.25" font-size="15" text-anchor="middle" fill="#cf222e" font-weight="normal">⚡</text><text x="990" y="127.35" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">Falha controlada</text><text x="990" y="140.35" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">(código 2)</text><polygon points="690,205.0 715.0,230 690,255.0 665.0,230" fill="#fff8e1" stroke="#b07d00" stroke-width="1.6"/><text x="690" y="236.3" font-size="18" text-anchor="middle" fill="#b07d00" font-weight="700">✕</text><text x="676" y="285.35" font-size="11" text-anchor="end" fill="#5c4400" font-weight="600">Chuva prevista</text><text x="676" y="298.35" font-size="11" text-anchor="end" fill="#5c4400" font-weight="600">≥ limite?</text><rect x="615" y="330" width="150" height="80" rx="10" fill="#fdeef3" stroke="#b0124a" stroke-width="1.6"/><text x="690" y="367.275" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">Registrar execução</text><text x="690" y="380.775" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal">sem ação</text><circle cx="850" cy="370" r="18.0" fill="#fff" stroke="#1f2328" stroke-width="4"/><text x="850" y="413.85" font-size="11" text-anchor="middle" fill="#333" font-weight="normal">Se